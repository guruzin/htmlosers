<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha de gastos</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Jost:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="#"> Inicio</a></li>
                <li><a href="#">Tabelas</a></li>
                <li><a href="#">Relatorios</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </nav>
    </header>


    <main>
        <h1>Planilha de gastos</h1>
        <table>
            <caption>Gastos no cartão</caption>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Item</th>
                    <th>Valor</th>
                    <th>Metodo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01/01/2026</td>
                    <td>lanches</td>
                    <td>10.00</td>
                    <td>Débito</td>
                    <td>
                        <input type="button" value="Editar" class="button">
                        <input type="button" value="Excluir" class="button">
                    </td>
                </tr>


            </tbody>
        </table>
        <input type="button" value="Nova entrada" class="button-entrada">

        <h1>Entradas</h1>
        <table>
            <tr>
                <th>Data</th>
                <th>Item</th>
                <th>Valor</th>
            </tr>
            <tr>
                <td>01/01/2026</td>
                <td>Salário</td>
                <td>2000.00</td>
            </tr>
        </table>
    </main>

</body>

</html>
