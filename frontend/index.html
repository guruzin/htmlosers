<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha de gastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/tema-noite.css" id="tema-noite" disabled>
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="#"> Inicio</a></li>
                <li><a href="#">Tabelas</a></li>
                <li><a href="#">Relatorios</a></li>
                <li><a href="#">Configurações</a></li>
                <li class="dark-mode">
                    <button id="botao-tema">🌙</button>
                </li>
            </ul>
        </nav>
    </header>


    <main>
        <h1>Planilha de gastos</h1>
        <table>
            <caption>Gastos no cartão</caption>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Item</th>
                    <th>Valor</th>
                    <th>Metodo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01/01/2026</td>
                    <td>lanches</td>
                    <td>10.00</td>
                    <td>Débito</td>
                    <td>
                        <input type="button" value="Editar" class="button">
                        <input type="button" value="Excluir" class="button">
                    </td>
                </tr>


            </tbody>
        </table>
        <input type="button" value="Nova entrada" class="button-entrada">

        <h1>Entradas</h1>
        <table>
            <tr>
                <th>Data</th>
                <th>Item</th>
                <th>Valor</th>
            </tr>
            <tr>
                <td>01/01/2026</td>
                <td>Salário</td>
                <td>2000.00</td>
            </tr>
        </table>
    </main>

</body>

</html>
